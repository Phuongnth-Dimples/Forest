<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest Adventure - Full Version</title>
<style>
    :root {
        --forest-dark: #123524;
        --forest-main: #2e8b57;
        --leaf: #b6ff7a;
        --accent: #d7ff9f;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Arial Rounded MT Bold', sans-serif; }

    body {
        background: #0d2618;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    #game-container {
        width: 100%; max-width: 500px; height: 100vh;
        position: relative; overflow: hidden;
        background: linear-gradient(to bottom, #5bc56d, #174b2f);
    }

    /* Forest Decorations */
    .tree { position: absolute; bottom: -20px; font-size: 90px; animation: sway 4s infinite ease-in-out; z-index: 1; }
    .animal { position: absolute; font-size: 45px; animation: walk 18s linear infinite; z-index: 2; pointer-events: none; }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes walk { from { left: -100px; } to { left: 550px; } }

    /* UI Styles */
    .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 20px; z-index: 10; }
    .hidden { display: none !important; }

    .btn-main {
        padding: 16px 45px; border: none; border-radius: 50px;
        background: linear-gradient(to bottom, #d7ff9f, #7bbf4f);
        font-size: 1.3rem; font-weight: bold; color: #23441e;
        cursor: pointer; box-shadow: 0 6px 0 #567c34;
    }
    .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #567c34; }

    .slot { width: 40px; border-bottom: 4px solid white; color: white; text-align: center; font-size: 2rem; margin: 0 5px; }
    .keyboard { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 20px; width: 100%; }
    .key { padding: 12px 0; border: none; border-radius: 10px; background: white; cursor: pointer; font-weight: bold; }
    .key.correct { background: #8fce91 !important; color: white; }
    .key.wrong { background: #ff7a7a !important; color: white; }

    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 100; visibility: hidden; opacity: 0; transition: 0.3s; }
    .overlay.active { visibility: visible; opacity: 1; }
    .popup { background: white; padding: 30px; border-radius: 30px; text-align: center; border: 8px solid var(--leaf); }

    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    .shake { animation: shake 0.3s ease-in-out; }
</style>
</head>
<body>

<div id="game-container">
    <!-- Decorations -->
    <div class="tree" style="left:-20px;">🌲</div>
    <div class="tree" style="right:-20px;">🌳</div>
    <div class="animal" style="top:15%; animation-duration:15s;">🦌</div>
    <div class="animal" style="top:35%; animation-duration:20s;">🐻</div>
    <div class="animal" style="top:60%; animation-duration:17s;">🦉</div>

    <!-- Start Screen -->
    <section id="start-screen" class="screen" style="justify-content: center;">
        <h1 style="color:white; font-size: 3rem; text-align: center;">FOREST<br>ADVENTURE</h1>
        <div style="font-size: 100px; margin: 30px 0;">🦊</div>
        <button class="btn-main" onclick="startGame()">START JOURNEY</button>
    </section>

    <!-- Game Screen -->
    <section id="game-screen" class="screen hidden">
        <div style="width: 100%; color: white; display: flex; justify-content: space-between; padding: 10px;">
            <span>🍄 Score: <span id="score">0</span></span>
            <span>❤️ Lives: <span id="lives">5</span></span>
        </div>
        
        <!-- Thanh đường đi với Fox và Đích đến -->
        <div style="width: 85%; height: 10px; background: rgba(255,255,255,0.3); margin: 40px 0; border-radius: 10px; position: relative;">
            <div id="fox-hero" style="position: absolute; top: -45px; left: 0; transition: 0.5s; font-size: 2.5rem;">🦊</div>
            <div style="position: absolute; right: -15px; top: -45px; font-size: 2.5rem;">🏕️</div>
        </div>

        <div id="emoji-hint" style="font-size: 5rem; margin-bottom: 20px;"></div>
        <div id="word-slots" style="display: flex; justify-content: center;"></div>
        <div id="keyboard" class="keyboard"></div>
    </section>

    <div id="overlay" class="overlay">
        <div class="popup">
            <h2 id="result-title"></h2>
            <button class="btn-main" style="margin-top:20px;" onclick="nextLevel()">CONTINUE</button>
        </div>
    </div>
</div>

<script>
    const WORDS = [{word:"FOX",hint:"🦊"}, {word:"BEAR",hint:"🐻"}, {word:"OWL",hint:"🦉"}, {word:"DEER",hint:"🦌"}, {word:"RABBIT",hint:"🐰"}];
    let currentWord = "", guessed = [], wrong = 0, score = 0;
    
    // Audio Engine
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') { osc.frequency.value = 600; gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 0.1); }
        else if (type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.value = 150; gain.gain.exponentialRampToValueAtTime(0.1, audioCtx.currentTime + 0.2); }
        else { [600, 800, 1000].forEach((f, i) => { const o = audioCtx.createOscillator(); o.connect(gain); o.frequency.value = f; o.start(audioCtx.currentTime + (i*0.1)); o.stop(audioCtx.currentTime + (i*0.1) + 0.1); }); return; }
        osc.start(); osc.stop(audioCtx.currentTime + (type === 'correct' ? 0.1 : 0.2));
    }

    function startGame() {
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        nextLevel();
    }

    function nextLevel() {
        wrong = 0; guessed = [];
        currentWord = WORDS[Math.floor(Math.random() * WORDS.length)].word;
        document.getElementById("emoji-hint").innerText = WORDS.find(w => w.word === currentWord).hint;
        document.getElementById("overlay").classList.remove("active");
        renderWord(); renderKeyboard(); updateUI();
    }

    function renderWord() {
        document.getElementById("word-slots").innerHTML = currentWord.split("").map(l => 
            `<div class="slot">${guessed.includes(l) ? l : ""}</div>`).join("");
    }

    function renderKeyboard() {
        document.getElementById("keyboard").innerHTML = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(l => 
            `<button class="key" onclick="handleGuess('${l}', this)">${l}</button>`).join("");
    }

    function handleGuess(letter, btn) {
        if (guessed.includes(letter)) return;
        guessed.push(letter);
        if (currentWord.includes(letter)) {
            btn.classList.add("correct");
            playSound('correct');
            if (currentWord.split("").every(l => guessed.includes(l))) { score += 10; finish(true); }
        } else {
            btn.classList.add("wrong");
            wrong++;
            playSound('wrong');
            document.getElementById("game-container").classList.add("shake");
            setTimeout(() => document.getElementById("game-container").classList.remove("shake"), 300);
            if (wrong >= 5) finish(false);
        }
        renderWord(); updateUI();
    }

    function updateUI() {
        document.getElementById("score").innerText = score;
        document.getElementById("lives").innerText = 5 - wrong;
        const unique = [...new Set(currentWord.split(""))];
        const progress = (guessed.filter(l => unique.includes(l)).length / unique.length) * 85;
        document.getElementById("fox-hero").style.left = progress + "%";
    }

    function finish(win) {
        document.getElementById("overlay").classList.add("active");
        document.getElementById("result-title").innerText = win ? "YOU ESCAPED! 🎉" : "LOST IN FOREST! 🌧️";
        if (win) playSound('win');
    }
</script>
</body>
</html>
